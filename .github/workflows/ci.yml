name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: portfolio
          POSTGRES_PASSWORD: portfolio
          POSTGRES_DB: portfolio
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://portfolio:portfolio@localhost:5432/portfolio
      NEXT_TELEMETRY_DISABLED: '1'
      TEST_DATABASE_URL: postgres://portfolio:portfolio@localhost:5432/portfolio
      INQUIRY_RATE_LIMIT_SECRET: local-ci-inquiry-secret-not-for-production-use
      ADMIN_SESSION_SECRET: local-ci-admin-secret-not-for-production-use
      ADMIN_PASSWORD: local-ci-password-not-for-production
      E2E_BASE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_CONVERSION_EVENTS_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run db:migrate
      - run: npx tsx src/db/seed.ts
      - run: npm run test:integration
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Start production server
        run: |
          nohup npm start > /tmp/portfolio-e2e.log 2>&1 &
          node --input-type=module - <<'JS'
          for (let i=0; i<40; i++) {
            try { if ((await fetch('http://127.0.0.1:3000/services')).ok) process.exit(0); } catch {}
            await new Promise(resolve => setTimeout(resolve, 500));
          }
          process.exit(1);
          JS
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - run: npm audit --omit=dev --audit-level=high
